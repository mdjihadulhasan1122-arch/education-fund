<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A67C3B">
<meta name="color-scheme" content="light">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<title>এডুকেশন ফান্ড</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: one-column khata (ledger) for phones. Five tabs at the bottom, lists and sheets above. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface2:#E8ECF3; --fg:#141B2D; --muted:#586278; --line:#D3DAE6;
  --accent:#2848A6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FA;
  --good:#17754A; --good-soft:#DCF0E5; --warn:#8F5600; --warn-soft:#FAE9C8; --crit:#B3261E; --crit-soft:#F9DCD9;
  --c1:#2848A6; --c2:#0E8486; --c3:#C38410; --c4:#7C6DB5;
  --font-display:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --font-body:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1222; --surface:#161D32; --surface2:#1F2842; --fg:#E7EBF6; --muted:#98A2BB; --line:#2A3453;
    --accent:#2F4FB0; --accent-ink:#FFFFFF; --accent-soft:#222E5A;
    --good:#5CD290; --good-soft:#163A2B; --warn:#F0B454; --warn-soft:#3B2D12; --crit:#FF8A80; --crit-soft:#431D1B;
    --c1:#7F9BF2; --c2:#4FC3C4; --c3:#E8B04A; --c4:#A99BE3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D32; --surface2:#1F2842; --fg:#E7EBF6; --muted:#98A2BB; --line:#2A3453;
  --accent:#2F4FB0; --accent-ink:#FFFFFF; --accent-soft:#222E5A;
  --good:#5CD290; --good-soft:#163A2B; --warn:#F0B454; --warn-soft:#3B2D12; --crit:#FF8A80; --crit-soft:#431D1B;
  --c1:#7F9BF2; --c2:#4FC3C4; --c3:#E8B04A; --c4:#A99BE3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font-body);
  padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.page{max-width:640px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.top h1{font:700 22px/1.25 var(--font-display);text-wrap:balance}
.top small{display:block;color:var(--muted);font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font:600 19px/1.3 var(--font-display)}
.sec-head small{color:var(--muted);font-size:14px}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 18px 16px}
.hero .eyebrow{font-size:14px;opacity:.85;letter-spacing:.02em}
.hero .big{font:700 36px/1.2 var(--font-display);margin-top:2px;overflow-wrap:anywhere}
.hero .sub{font-size:13px;opacity:.8;margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:block;width:100%;text-align:left;min-width:0}
.card h3{font:600 16px/1.3 var(--font-display);margin-bottom:10px}
button.tap{cursor:pointer}
button.tap:active{background:var(--surface2)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:10px}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:22px 14px}
.empty p{color:var(--muted)}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted)}
.row b{font:600 16px var(--font-display);text-align:right;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;font-family:var(--font-body)}
.pos{color:var(--good)} .neg{color:var(--crit)} .wr{color:var(--warn)}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.mute{background:var(--surface2);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn[disabled]{opacity:.6;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* avatar */
.av{position:relative;flex:none;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;font:600 18px var(--font-display);color:#fff;background:var(--c1)}
.av[data-h="1"]{background:var(--c2)} .av[data-h="2"]{background:var(--c3)} .av[data-h="3"]{background:var(--c4)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* member cards */
.mcard{display:flex;gap:12px;align-items:flex-start}
.mc-main{display:grid;gap:3px;min-width:0;flex:1}
.mc-name{font:600 17px/1.3 var(--font-display);overflow-wrap:anywhere}
.mc-sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.mc-nums{font-size:14px}
.mc-meter{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.mc-meter i{display:block;height:100%;background:var(--good)}
.mc-side{flex:none}
.idtag{display:inline-block;background:var(--accent-soft);color:var(--c1);border-radius:8px;padding:0 8px;font:600 13px var(--font-body);margin-left:6px;vertical-align:1px}
.idtag.big{font-size:15px;margin:4px 0 0;padding:2px 10px}
.idbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.idbox span{display:grid;background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.idbox small{color:var(--muted);font-size:13px}
.idbox b{font:600 16px var(--font-display);overflow-wrap:anywhere}

/* where-is-money */
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-bottom:12px}
.stack i{display:block;height:100%}
.leg{display:grid;gap:2px}
.leg .row{align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

/* deposit table */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
table.grid th,table.grid td{padding:0;text-align:center;font-size:13px;border-bottom:1px solid var(--line);height:44px;min-width:44px}
table.grid thead th{background:var(--surface2);color:var(--muted);font-weight:500;position:sticky;top:0}
table.grid .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px;min-width:104px;max-width:104px;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line)}
table.grid thead .name{background:var(--surface2)}
table.grid tr:last-child th,table.grid tr:last-child td{border-bottom:0}
table.grid .tot{min-width:64px;padding:0 8px;font-weight:600;font-size:13px}
.cellbtn{all:unset;display:grid;place-items:center;width:100%;height:44px;cursor:pointer}
.cellbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.cell{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:8px;font-weight:600;font-size:14px}
.cell.ok{background:var(--good-soft);color:var(--good)}
.cell.due{background:var(--crit-soft);color:var(--crit)}
.cell.part{background:var(--warn-soft);color:var(--warn);font-size:12px}
.cell.fut,.cell.na{color:var(--muted);font-weight:400}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* cows */
.cow{display:grid;gap:12px}
.cow-top{display:flex;gap:12px;align-items:center}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.figs span{display:grid;background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.figs small{color:var(--muted);font-size:12.5px}
.figs b{font:600 16px var(--font-display);overflow-wrap:anywhere}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.strip small{display:block;color:var(--muted);font-size:13px}
.strip b{font:600 17px var(--font-display);overflow-wrap:anywhere}
.shots{display:flex;gap:12px;flex-wrap:wrap}
.shot{all:unset;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:13px;color:var(--muted)}
.shot img,.shot .ph{width:104px;height:104px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.exp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp small{display:block;color:var(--muted)}

/* segments */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs div{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:1px;padding:8px 2px 7px;min-height:58px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs{box-shadow:0 -8px 24px rgba(20,27,45,.07)}
nav.tabs button{gap:3px;padding-top:7px}
nav.tabs .ic{display:grid;place-items:center;width:54px;height:32px;border-radius:999px;transition:background .15s}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs svg .f{fill:currentColor;fill-opacity:.14}
nav.tabs button[aria-current="page"]{color:var(--c1);font-weight:600}
nav.tabs button[aria-current="page"] .ic{background:var(--accent-soft)}
nav.tabs button[aria-current="page"] svg{stroke-width:2}
nav.tabs button[aria-current="page"] svg .f{fill-opacity:.32}
:root{--t1:#2848A6;--t2:#0E8486;--t3:#C38410;--t4:#7C6DB5;--t5:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t1:#4A68D0;--t2:#1FA3A5;--t3:#D99A24;--t4:#9484D4;--t5:#D9524A}}
:root[data-theme="dark"]{--t1:#4A68D0;--t2:#1FA3A5;--t3:#D99A24;--t4:#9484D4;--t5:#D9524A}
nav.tabs .ic{width:42px;height:42px;border-radius:14px;color:#fff;transition:box-shadow .15s}
nav.tabs .ic svg{width:25px;height:25px;fill:#fff;stroke:none}
nav.tabs button[aria-current="page"] .ic{box-shadow:0 0 0 3px var(--accent-soft)}
nav.tabs button{padding-top:6px;padding-bottom:5px}
body{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
/* warm cream and ochre palette */
:root{--bg:#F8F3EA;--surface:#FDFCF7;--surface2:#F1E7D6;--fg:#3E3427;--muted:#8C7F6D;--line:#E9E0CE;--accent:#A67C3B;--accent-ink:#FFFFFF;--accent-soft:#F1E7D6;--good:#3E7B50;--good-soft:#E4EEDC;--warn:#935F14;--warn-soft:#F6E6C6;--crit:#A8402F;--crit-soft:#F5DDD6;--c1:#8A6224;--c2:#4E7D6C;--c3:#C2603F;--c4:#7A6A9A;--t1:#A67C3B;--t2:#5E8672;--t3:#C2703D;--t4:#8C6A4F;--t5:#B0473A;--a1:#A67C3B;--a2:#5E8672;--a3:#C2703D;--a4:#7A6A9A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1812;--surface:#27221A;--surface2:#332C21;--fg:#F2E9D8;--muted:#B3A58E;--line:#3A3326;--accent:#9C7233;--accent-ink:#FFFFFF;--accent-soft:#3A2F1C;--good:#7FCB95;--good-soft:#1F3626;--warn:#EDB95C;--warn-soft:#3B2D12;--crit:#F09A86;--crit-soft:#432520;--c1:#DDB468;--c2:#7FB3A0;--c3:#E08C6A;--c4:#B3A3D3;--t1:#B8893F;--t2:#6E9C86;--t3:#CF7F4B;--t4:#A07D5F;--t5:#C45A4B}}
:root[data-theme="dark"]{--bg:#1C1812;--surface:#27221A;--surface2:#332C21;--fg:#F2E9D8;--muted:#B3A58E;--line:#3A3326;--accent:#9C7233;--accent-ink:#FFFFFF;--accent-soft:#3A2F1C;--good:#7FCB95;--good-soft:#1F3626;--warn:#EDB95C;--warn-soft:#3B2D12;--crit:#F09A86;--crit-soft:#432520;--c1:#DDB468;--c2:#7FB3A0;--c3:#E08C6A;--c4:#B3A3D3;--t1:#B8893F;--t2:#6E9C86;--t3:#CF7F4B;--t4:#A07D5F;--t5:#C45A4B}
.av{background:var(--a1)}
.av[data-h="1"]{background:var(--a2)}
.av[data-h="2"]{background:var(--a3)}
.av[data-h="3"]{background:var(--a4)}
.card{border-radius:20px}
.hero{border-radius:26px;padding:22px 20px 20px}
.hero .eyebrow{opacity:.95}
.sheet{border-radius:26px 26px 0 0}
.trx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;letter-spacing:.02em}

/* sheets */
.wrap{position:fixed;inset:0;z-index:40;background:rgba(8,12,26,.55);display:flex;align-items:flex-end;justify-content:center}
.wrap.f{z-index:50}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;overscroll-behavior:contain;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sheet h2{font:700 20px/1.3 var(--font-display)}
.sheet .who{display:flex;gap:14px;align-items:center}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld>label{font-weight:500;font-size:14px;color:var(--muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=month],.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;font-size:16px}
.fld small{color:var(--muted);font-size:13px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px}
.chk input{width:20px;height:20px}
.photo{display:flex;gap:14px;align-items:center}
.pv{width:84px;height:84px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none}
.pv img{width:100%;height:100%;object-fit:cover}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ph-st{font-size:13px;color:var(--muted);margin-top:4px}
.err{color:var(--crit);font-size:14px;margin:0 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
<style>
[hidden]{display:none!important}
img{max-width:100%}
.fld input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;font-size:16px}
#authbox{display:grid;gap:14px}
.alogo{width:72px;height:72px;border-radius:22px;background:var(--accent);display:grid;place-items:center;margin:8px auto 0}
.alogo svg{width:40px;height:40px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.atitle{font:700 27px/1.3 var(--font-display);margin:6px 0 0;text-align:center}
.asub{margin:0;text-align:center;color:var(--muted);font-size:17px}
.abig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:18px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.abig.alt{background:transparent;color:var(--accent)}
.abig svg,.aback svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aback{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:none;border:0;color:var(--muted);font:inherit;font-size:17px;min-height:44px;padding:0;cursor:pointer}
.afld{display:grid;gap:6px}.afld label{font-weight:600;font-size:17px}
.afld input{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;width:100%;font:inherit;font-size:18px}
.ahint{font-size:15px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.amsg{margin:0;font-size:16px;color:var(--muted)}.amsg.aerr{color:#B3402F;font-weight:600}
</style>
</head>
<body>


<div class="page" id="app">
  <div class="top"><div><h1>এডুকেশন ফান্ড</h1><small>সমিতির হিসাব-খাতা</small></div><span style="display:flex;gap:8px;align-items:center"><span id="mode"></span><button type="button" class="btn sm" id="logout" hidden>লগ আউট</button></span></div>
  <div id="note"></div>
  <main id="view" class="page" style="padding:0"></main>
</div>
<nav class="tabs" aria-label="মেনু"><div id="tabs"></div></nav>
<div class="wrap" id="dwrap" hidden><div class="sheet" id="dsheet" role="dialog" aria-modal="true"></div></div>
<div class="wrap f" id="fwrap" hidden><div class="sheet" id="fsheet" role="dialog" aria-modal="true"></div></div>
<div class="lb" id="lb" hidden><img alt="" id="lbimg"></div>
<div class="toast" id="toast" hidden></div>


<div id="auth" style="position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none">
  <div style="max-width:420px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px)) 32px;display:grid;gap:14px">
    <div id="authbox"></div>
  </div>
</div>
<script type="text/plain" id="appjs">
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var FUND_START='2023-01';
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var SHORT=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
var DIG='০১২৩৪৫৬৭৮৯';
var COLLS=['members','deposits','cows','banks','loans','expenses','settings','log','payments','links'];
var TABS=[
 ['home','হিসাব','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],
 ['members','সদস্য','<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M18.5 14.4c2 .8 3.2 2.8 3.2 5.6"/>'],
 ['deposits','জমা','<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/>'],
 ['cows','গরু','<path d="M5 8C3 8 2 6.5 2 5c2 0 3.500.5 4.500 2M19 8c2 0 3-1.500 3-3-2 0-3.500.5-4.500 2"/><path d="M7 7.500h10l1 6c0 3-2.500 5.500-6 5.500s-6-2.500-6-5.500z"/><circle cx="9.500" cy="12" r=".7"/><circle cx="14.500" cy="12" r=".7"/>'],
 ['bank','ব্যাংক','<path d="M3 9l9-5 9 5M5 9v9M9.500 9v9M14.500 9v9M19 9v9M3 20h18"/>']
];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtN(n,g){try{return Number(n).toLocaleString('bn-BD',{useGrouping:g!==false,maximumFractionDigits:0})}catch(e){return String(n)}}
function money(n){n=Math.round(Number(n)||0);return (n<0?'−':'')+'৳ '+fmtN(Math.abs(n))}
function toNum(s){var t=String(s==null?'':s).replace(/[০-৯]/g,function(c){return DIG.indexOf(c)}).replace(/[,\s৳]/g,'');return t===''?NaN:Number(t)}
function pad(n){return String(n).padStart(2,'0')}
var NOW=new Date();
var CUR=NOW.getFullYear()+'-'+pad(NOW.getMonth()+1);
var TODAY=CUR+'-'+pad(NOW.getDate());
function fmtYM(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+fmtN(p[0],false)}
function fmtDate(s){if(!s)return '—';var p=s.split('-');return fmtN(+p[2],false)+' '+MONTHS[+p[1]-1]+' '+fmtN(p[0],false)}
function monthsBetween(a,b){var out=[],p=a.split('-').map(Number),q=b.split('-').map(Number),y=p[0],m=p[1];
  while(y<q[0]||(y===q[0]&&m<=q[1])){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++}}return out}
function clone(o){return JSON.parse(JSON.stringify(o))}
function firstChar(s){s=String(s||'').trim();if(!s)return '?';try{if(Intl.Segmenter){return new Intl.Segmenter('bn',{granularity:'grapheme'}).segment(s)[Symbol.iterator]().next().value.segment}}catch(e){}return Array.from(s)[0]}
function hue(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%4}
function avatar(photo,name,size){
  return '<span class="av" data-h="'+hue(name)+'" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.42)+'px">'+esc(firstChar(name))+
    (photo?'<img src="'+esc(blobUrl(photo))+'" alt="">':'')+'</span>';
}
function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>'}
function btn(act,label,cls,attrs){return '<button type="button" class="btn '+(cls||'')+'" data-act="'+act+'" '+(attrs||'')+'>'+esc(label)+'</button>'}
var chains={};
function enqueue(key,task){var p=(chains[key]||Promise.resolve()).catch(function(){}).then(task);chains[key]=p;return p}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}
function errMsg(e){return e&&e.code==='invalid_argument'?'এই ভিউতে লেখার অনুমতি নেই':'সেভ হয়নি, আবার চেষ্টা করুন'}

function idOf(m){return m.no?'EF-'+String(m.no).padStart(3,'0'):'EF-—'}
function nextNo(){return S.members.reduce(function(a,x){return Math.max(a,+x.no||0)},0)+1}
var fixing=false;
function fixNos(){
  if(fixing||!S.db)return;
  var miss=S.members.filter(function(m){return !m.no}).sort(function(a,b){return (a.start||'').localeCompare(b.start||'')||(a.name||'').localeCompare(b.name||'','bn')});
  if(!miss.length)return;fixing=true;var n=nextNo();
  miss.reduce(function(p,m){var d=clone(m),id=m.id;delete d.id;d.no=n++;return p.then(function(){return enqueue('members/'+id,function(){return S.db.collection('members').doc(id).set(d)})})},Promise.resolve()).catch(function(){}).then(function(){fixing=false});
}
/* ---------- state ---------- */
var S={db:null,assets:null,canWrite:false,inited:false,slow:false,loaded:{},
  members:[],deposits:[],cows:[],banks:[],loans:[],expenses:[],settings:[],log:[],payments:[],links:[],names:{},
  tab:'home',year:+CUR.slice(0,4),seg:'bank',cowFilter:'all',detail:null,X:null};
function tabFromHash(){var h=(location.hash||'').slice(1);return TABS.some(function(t){return t[0]===h})?h:'home'}
S.tab=tabFromHash();

/* ---------- derived numbers ---------- */
function derive(){
  var ids={};S.members.forEach(function(m){ids[m.id]=1});
  var rt=S.settings.filter(function(x){return x.id==='rates'})[0];
  var rates=(rt&&rt.list&&rt.list.length?rt.list.slice():[{from:FUND_START,amount:3000}]).sort(function(a,b){return a.from.localeCompare(b.from)});
  function rateFor(ym){var r=rates[0].amount;for(var i=0;i<rates.length;i++){if(rates[i].from<=ym)r=rates[i].amount}return r}
  var P={},depTotal=0;
  S.deposits.forEach(function(d){
    if(!ids[d.memberId])return;
    var mm=d.months||{};
    Object.keys(mm).forEach(function(k){var a=+(mm[k]&&mm[k].a)||0;(P[d.memberId]=P[d.memberId]||{})[d.year+'-'+k]=a;depTotal+=a});
  });
  var members=S.members.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','bn')}).map(function(m){
    var monthly=rateFor(CUR),start=m.start||FUND_START,yms=monthsBetween(start,CUR),paid=0,due=0,dueList=[],ok=0,mine=P[m.id]||{};
    Object.keys(mine).forEach(function(k){paid+=mine[k]});
    yms.forEach(function(ym){var r=rateFor(ym),a=mine[ym]||0;if(a>=r)ok++;else{due+=r-a;dueList.push(ym)}});
    return Object.assign({},m,{monthly:monthly,start:start,paid:paid,due:due,dueList:dueList,ok:ok,expected:yms.length});
  });
  var totalDue=members.reduce(function(s,m){return s+m.due},0);
  var thisPaid=members.filter(function(m){return m.start<=CUR&&(P[m.id]||{})[CUR]>=m.monthly}).length;
  var thisEligible=members.filter(function(m){return m.start<=CUR}).length;

  var cows=S.cows.slice().sort(function(a,b){return (a.givenDate||'').localeCompare(b.givenDate||'')}).map(function(c,i){
    var buy=+c.buyPrice||0,ex=(c.expenses||[]).reduce(function(s,e){return s+(+e.amount||0)},0),cost=buy+ex,sold=c.status==='sold',sp=+c.soldPrice||0;
    return Object.assign({},c,{_name:c.label||('গরু '+fmtN(i+1,false)),buy:buy,ex:ex,cost:cost,sold:sold,sp:sp,profit:sold?sp-cost:null});
  });
  var running=cows.filter(function(c){return !c.sold}),soldC=cows.filter(function(c){return c.sold});
  var realized=soldC.reduce(function(s,c){return s+c.profit},0);
  var cowsCost=running.reduce(function(s,c){return s+c.cost},0);
  var bankTotal=S.banks.reduce(function(s,b){return s+(+b.balance||0)},0);
  var loanOut=S.loans.reduce(function(s,l){return s+Math.max(0,(+l.amount||0)-(+l.returned||0))},0);
  var expTotal=S.expenses.reduce(function(s,e){return s+(+e.amount||0)},0);
  var bankExp=S.expenses.filter(function(e){return e.cat==='ব্যাংক খরচ'}).reduce(function(s,e){return s+(+e.amount||0)},0);
  var shouldHave=depTotal+realized-expTotal;
  var gap=shouldHave-(bankTotal+loanOut+cowsCost);
  return {rates:rates,rateFor:rateFor,P:P,members:members,depTotal:depTotal,totalDue:totalDue,thisPaid:thisPaid,thisEligible:thisEligible,
    cows:cows,running:running,soldC:soldC,realized:realized,cowsCost:cowsCost,bankTotal:bankTotal,loanOut:loanOut,
    expTotal:expTotal,bankExp:bankExp,shouldHave:shouldHave,gap:gap};
}

/* ---------- views ---------- */
function head(title,sub,action){return '<div class="sec-head"><div><h2>'+esc(title)+'</h2>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+(action||'')+'</div>'}
function emptyCard(msg,actionHtml){return '<div class="card empty"><p>'+esc(msg)+'</p>'+(S.canWrite?(actionHtml||''):'')+'</div>'}
function row(k,v,cls,small){return '<div class="row"><span>'+k+(small?'<small>'+small+'</small>':'')+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b></div>'}
function tapEl(act,id,inner,cls){return S.canWrite?'<button type="button" class="card tap '+(cls||'')+'" data-act="'+act+'" data-id="'+esc(id)+'">'+inner+'</button>':'<div class="card '+(cls||'')+'">'+inner+'</div>'}

function viewHome(){
  var X=S.X,h='';
  var nothing=!S.members.length&&!S.cows.length&&!S.banks.length&&!S.loans.length;
  h+=accountsCard();h+=meCard();h+=pendNote();h+='<section class="hero"><p class="eyebrow">সমিতির মোট সম্পদ</p><p class="big">'+money(X.shouldHave)+'</p><p class="sub">মোট জমা + গরুর লাভ − খরচ</p></section>';
  if(nothing){
    h+=emptyCard('এখনো কোনো তথ্য ওঠেনি। প্রথমে সদস্যদের নাম তুলুন, তারপর জমা, গরু আর ব্যাংকের হিসাব।',btn('go-members','সদস্য যোগ করুন','primary'));
    if(!S.canWrite)h+='<div class="card empty"><p>সম্পাদক তথ্য তুললে এখানে সব হিসাব দেখা যাবে।</p></div>';
    return h;
  }
  var parts=[['ব্যাংকে',X.bankTotal,'var(--c1)'],['মানুষের কাছে ধার',X.loanOut,'var(--c2)'],['চলমান গরুতে',X.cowsCost,'var(--c3)']];
  if(X.gap>0)parts.push(['হাতে নগদ বা অন্য জায়গায়',X.gap,'var(--c4)']);
  var tot=parts.reduce(function(s,p){return s+Math.max(0,p[1])},0);
  h+='<section class="card"><h3>টাকা এখন কোথায় আছে</h3><div class="stack" role="img" aria-label="টাকা কোথায় আছে">'+
    parts.map(function(p){return tot>0&&p[1]>0?'<i style="width:'+(p[1]/tot*100)+'%;background:'+p[2]+'"></i>':''}).join('')+'</div><div class="leg">'+
    parts.map(function(p){var pc=tot>0?Math.round(Math.max(0,p[1])/tot*100):0;return '<div class="row"><span><i class="dot" style="background:'+p[2]+'"></i>'+p[0]+'</span><b>'+money(p[1])+' <small style="display:inline">('+fmtN(pc,false)+'%)</small></b></div>'}).join('')+'</div>'+
    (X.gap<0?'<p class="hint wr">হিসাবে অমিল আছে: ব্যাংক, ধার আর গরুর মোট টাকা জমা ও লাভের চেয়ে '+money(-X.gap)+' বেশি দেখাচ্ছে। এন্ট্রিগুলো আবার দেখুন।</p>':'<p class="hint">হাতে নগদ = (জমা + লাভ − খরচ) থেকে ব্যাংক, ধার ও চলমান গরুর টাকা বাদ দিলে যা থাকে।</p>')+'</section>';
  h+='<section class="card"><h3>মোট হিসাব</h3>'+
    row('মোট জমা',money(X.depTotal))+
    row('গরু থেকে লাভ',money(X.realized),X.realized>0?'pos':X.realized<0?'neg':'','বিক্রি হওয়া গরুর হিসাবে')+
    row('মোট খরচ',money(X.expTotal),'','এর মধ্যে ব্যাংক খরচ '+money(X.bankExp))+
    row('সদস্যদের কাছে বাকি',money(X.totalDue),X.totalDue>0?'wr':'pos')+'</section>';
  h+='<section class="card"><h3>এই মাসে ('+fmtYM(CUR)+')</h3>'+row('জমা দিয়েছে',fmtN(X.thisPaid,false)+' / '+fmtN(X.thisEligible,false)+' জন')+
    row('চলমান গরু',fmtN(X.running.length,false)+' টি')+row('বিক্রি হয়েছে',fmtN(X.soldC.length,false)+' টি')+'</section>';
  var owing=X.members.filter(function(m){return m.due>0}).sort(function(a,b){return b.due-a.due});
  h+='<section class="card"><div class="sec-head" style="margin-bottom:6px"><h3 style="margin:0">কার কত বাকি</h3>'+(owing.length?btn('copy-due','WhatsApp-এর জন্য কপি','sm'):'')+'</div>'+(owing.length?owing.map(function(m){
    return '<div class="row"><span>'+esc(m.name)+'<small>'+fmtN(m.dueList.length,false)+' মাস বাকি</small></span><b class="wr">'+money(m.due)+'</b></div>'}).join(''):'<p class="muted">সবার জমা হালনাগাদ আছে।</p>')+'</section>';
  h+=logCard();h+=backupCard();
  return h;
}

function memberCard(m){
  var pct=m.expected?Math.round(m.ok/m.expected*100):0;
  var st=m.expected===0?pill('নতুন','mute'):m.due>0?pill('বাকি '+fmtN(m.dueList.length,false)+' মাস',m.dueList.length>3?'crit':'warn'):pill('সব জমা','good');
  return '<button type="button" class="card tap mcard" data-act="member" data-id="'+esc(m.id)+'">'+avatar(m.photo,m.name,48)+
    '<span class="mc-main"><span class="mc-name">'+esc(m.name)+'<span class="idtag">'+idOf(m)+'</span></span><span class="mc-sub">'+esc([m.country,m.phone].filter(Boolean).join(' · ')||'—')+'</span>'+
    '<span class="mc-meter"><i style="width:'+pct+'%"></i></span>'+
    '<span class="mc-nums">জমা '+money(m.paid)+' · বাকি '+money(m.due)+'</span></span><span class="mc-side">'+st+'</span></button>';
}
function viewMembers(){
  var X=S.X;
  var h=head('সদস্য',fmtN(X.members.length,false)+' জন','<span style="display:flex;gap:8px;flex-wrap:wrap">'+(S.canWrite&&X.members.length?btn('pdf-all','সবার PDF','sm'):'')+(S.canWrite?btn('add-member','+ নতুন সদস্য','primary sm'):'')+'</span>');
  if(!X.members.length)h+=emptyCard('এখনো কোনো সদস্য নেই।',btn('add-member','প্রথম সদস্য যোগ করুন','primary'));
  else h+='<div class="list">'+X.members.map(memberCard).join('')+'</div>';
  return h;
}

function viewDeposits(){
  var X=S.X,y=S.year,years=[];
  for(var i=+FUND_START.slice(0,4);i<=+CUR.slice(0,4);i++)years.push(i);
  var h=head('মাসিক জমা',null,S.canWrite&&X.members.length?btn('bulk','দ্রুত এন্ট্রি','sm'):'');
  h+=payCard();
  h+='<div class="chips" role="group" aria-label="বছর">'+years.map(function(v){return '<button type="button" class="chip" data-act="year" data-y="'+v+'" aria-pressed="'+(v===y)+'">'+fmtN(v,false)+'</button>'}).join('')+'</div>';
  if(!X.members.length)return h+emptyCard('জমার ঘর দেখতে আগে সদস্য যোগ করুন।',btn('go-members','সদস্য যোগ করুন','primary'));
  h+='<div class="legend"><span><b class="pos">✓</b> জমা</span><span><b class="neg">✕</b> বাকি</span><span><b class="wr">আং</b> আংশিক</span><span>– সদস্য ছিল না</span></div>';
  var yTot=0,yDue=0;
  var rows=X.members.map(function(m){
    var tot=0;
    var cells=SHORT.map(function(_,i){
      var ym=y+'-'+pad(i+1),a=(X.P[m.id]||{})[ym]||0,r=X.rateFor(ym),cls,txt;tot+=a;
      if(ym<m.start){cls='na';txt='–'}
      else if(a>=r){cls='ok';txt='✓'}
      else if(a>0){cls='part';txt='আং'}
      else if(ym>CUR){cls='fut';txt='·'}
      else{cls='due';txt='✕'}
      if(ym>=m.start&&ym<=CUR&&a<r)yDue+=r-a;
      var inner='<span class="cell '+cls+'">'+txt+'</span>';
      return '<td>'+(S.canWrite&&ym>=m.start?'<button type="button" class="cellbtn" data-act="dep" data-id="'+esc(m.id)+'" data-ym="'+ym+'" aria-label="'+esc(m.name)+', '+fmtYM(ym)+'">'+inner+'</button>':inner)+'</td>';
    }).join('');
    yTot+=tot;
    return '<tr><th class="name" scope="row">'+esc(m.name)+'</th>'+cells+'<td class="tot">'+fmtN(tot)+'</td></tr>';
  }).join('');
  h+='<div class="grid-scroll"><table class="grid"><thead><tr><th class="name">সদস্য</th>'+SHORT.map(function(s){return '<th>'+s+'</th>'}).join('')+'<th>মোট</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='<section class="card">'+row(fmtN(y,false)+' সালে মোট জমা',money(yTot))+row(fmtN(y,false)+' সালের বাকি (আজ পর্যন্ত)',money(yDue),yDue>0?'wr':'pos')+'</section>';
  h+='<section class="card"><div class="sec-head" style="margin-bottom:4px"><h3 style="margin:0">মাসিক জমার হার</h3>'+(S.canWrite?btn('add-rate','হার বাড়ান বা বদলান','sm'):'')+'</div>'+
    X.rates.map(function(r,i){var inner='<span>'+fmtYM(r.from)+' থেকে</span><b>'+money(r.amount)+'</b>';return S.canWrite?'<button type="button" class="exp" data-act="rate" data-i="'+i+'">'+inner+'</button>':'<div class="exp" style="cursor:default">'+inner+'</div>'}).join('')+
    '<p class="hint">হার বাড়ালে শুধু নতুন হারের মাসগুলো থেকে হিসাব বদলাবে, আগের মাসের জমা-বাকি আগের মতোই থাকবে।</p></section>';
  if(S.canWrite)h+='<p class="hint">কোনো ঘরে চাপ দিলে সেই মাসের জমা লেখা বা মোছা যায়।</p>';
  return h;
}

function cowCard(c){
  var st=c.sold?pill('বিক্রি হয়েছে','mute'):pill('চলমান','good');
  var figs='<span><small>দেওয়া টাকা</small><b>'+money(c.buy)+'</b></span><span><small>খাবার ও অন্য খরচ</small><b>'+money(c.ex)+'</b></span><span><small>মোট খরচ</small><b>'+money(c.cost)+'</b></span>';

function needDb(){if(!S.db){toast('এই ভিউতে সেভ করা যাবে না');return false}return true}
function newId(coll){return S.db.collection(coll).doc().id}
function put(coll,id,data){var ex=(S[coll]||[]).some(function(x){return x.id===id});return enqueue(coll+'/'+id,function(){return S.db.collection(coll).doc(id).set(data)}).then(function(r){logIt(ex?'বদল':'যোগ',coll,logText(coll,data));return r})}
function del(coll,id){var old=(S[coll]||[]).filter(function(x){return x.id===id})[0];return enqueue(coll+'/'+id,function(){return S.db.collection(coll).doc(id).delete()}).then(function(r){if(coll!=='deposits')logIt('মুছল',coll,logText(coll,old));return r})}
function setPaid(memberId,ym,amount,date){
  var y=ym.slice(0,4),m=ym.slice(5),id=memberId+'_'+y;
  return enqueue('deposits/'+id,function(){
    var cur=S.deposits.filter(function(d){return d.id===id})[0],data=cur?clone(cur):{memberId:memberId,year:+y,months:{}};
    delete data.id;data.months=data.months||{};
    if(amount>0)data.months[m]={a:amount,d:date||''};else delete data.months[m];
    return S.db.collection('deposits').doc(id).set(data);
  });
}
async function bulkFill(ids,from,to){
  var yms=monthsBetween(from,to);
  for(var i=0;i<ids.length;i++){
    var mem=S.X.members.filter(function(m){return m.id===ids[i]})[0];if(!mem)continue;
    var byYear={};
    yms.forEach(function(ym){if(ym<mem.start)return;(byYear[ym.slice(0,4)]=byYear[ym.slice(0,4)]||[]).push(ym.slice(5))});
    var ys=Object.keys(byYear);
    for(var j=0;j<ys.length;j++){
      var y=ys[j],id=ids[i]+'_'+y;
      await enqueue('deposits/'+id,function(){
        var cur=S.deposits.filter(function(d){return d.id===id})[0],data=cur?clone(cur):{memberId:ids[i],year:+y,months:{}};
        delete data.id;data.months=data.months||{};
        byYear[y].forEach(function(m){if(!(data.months[m]&&+data.months[m].a>0))data.months[m]={a:S.X.rateFor(y+'-'+m),d:''}});
        return S.db.collection('deposits').doc(id).set(data);
      });
    }
  }
}

function fieldHtml(f,vals){
  var id='ff_'+f.k,v=vals[f.k]==null?'':vals[f.k],c='';
  if(f.type==='select')c='<select id="'+id+'">'+f.opts.map(function(o){return '<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  else if(f.type==='textarea')c='<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea>';
  else if(f.type==='photo'){
    c=S.assets?'<div class="photo"><div class="pv" id="'+id+'_pv">'+(v?'<img src="'+esc(blobUrl(v))+'" alt="">':'ছবি নেই')+'</div><div><label class="btn sm" for="'+id+'">ছবি বাছুন</label><input id="'+id+'" type="file" accept="image/*" data-photo="'+f.k+'" class="vh"><p class="ph-st" id="'+id+'_st"></p></div></div>':'<small>এই ভিউতে ছবি তোলা চালু নেই।</small>';
  }
  else if(f.type==='checks')c='<div class="checks">'+f.opts.map(function(o){return '<label class="chk"><input type="checkbox" name="'+id+'" value="'+esc(o[0])+'" checked><span>'+esc(o[1])+'</span></label>'}).join('')+'</div>';
  else{var t=(f.type==='date'||f.type==='month')?f.type:'text',im=f.type==='num'?' inputmode="numeric"':f.type==='tel'?' inputmode="tel"':'';
    c='<input id="'+id+'" type="'+t+'" value="'+esc(v)+'"'+im+' autocomplete="off"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>'}
  return '<div class="fld"><label for="'+id+'">'+esc(f.label)+(f.req?' *':'')+'</label>'+c+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</div>';
}

async function shrink(file){
  var url=URL.createObjectURL(file);
  var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=url});
  var r=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('x'))},'image/jpeg',.82)});
}

function allocate(m,amount){
  var X=S.X,left=+amount||0,out=[],mo=+CUR.slice(5)+36,ey=+CUR.slice(0,4)+Math.floor((mo-1)/12),em=((mo-1)%12)+1,end=ey+'-'+pad(em);
  monthsBetween(m.start,end).forEach(function(ym){
    if(left<=0)return;
    var need=X.rateFor(ym)-((X.P[m.id]||{})[ym]||0);
    if(need>0){var take=Math.min(left,need);out.push({ym:ym,a:take});left-=take}
  });
  return out;
}
async function applyAlloc(memberId,alloc,date,trx){
  var byYear={};
  alloc.forEach(function(x){(byYear[x.ym.slice(0,4)]=byYear[x.ym.slice(0,4)]||[]).push(x)});
  var ys=Object.keys(byYear);
  for(var j=0;j<ys.length;j++){
    var y=ys[j],id=memberId+'_'+y,list=byYear[y];
    await enqueue('deposits/'+id,function(){
      var cur=S.deposits.filter(function(d){return d.id===id})[0],data=cur?clone(cur):{memberId:memberId,year:+y,months:{}};
      delete data.id;data.months=data.months||{};

    });
  }
}

function pcanvas(){var c=document.createElement('canvas');c.width=PW;c.height=PH;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);return {c:c,g:g}}

  ids.forEach(function(i){SIGNED[i]=PIX});
  (r.data||[]).forEach(function(x){if(x&&x.signedUrl&&x.path)SIGNED[x.path]=x.signedUrl});
  window.dispatchEvent(new Event('hashchange'));
}
var assets={upload:async function(blob){
  var path=newId()+'.jpg',r=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
  if(r.error)throw perm(r.error);
  var s=await sb.storage.from('photos').createSignedUrl(path,86400);SIGNED[path]=(s.data&&s.data.signedUrl)||PIX;
  return {id:path,url:SIGNED[path]};
}};
var downloads={save:async function(r){
  var blob=r.data instanceof Blob?r.data:new Blob([r.data],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return {status:'saved'};
}};
window.claude={use:async function(n){
  if(n==='db')return db;if(n==='user')return user;if(n==='downloads')return downloads;
  if(n==='assets')return isAdmin?assets:null;return null;
}};

/* ---------- admin: approve new accounts ---------- */
window.__accts=[];
async function loadAccts(){
  if(!isAdmin)return;
  var r=await sb.from('profiles').select('id,name,email,phone,role').eq('role','pending');
  var n=(r.data||[]);var changed=JSON.stringify(n)!==JSON.stringify(window.__accts);
  window.__accts=n;if(changed)window.dispatchEvent(new Event('hashchange'));
}
window.__acctAct=async function(id,r){await sb.from('profiles').update({role:r}).eq('id',id);await loadAccts()};

/* ---------- start ---------- */
function paintWait(msg,withOut){
  showAuth();box.innerHTML='<section class="card" style="display:grid;gap:12px"><h3 style="margin:0">'+esc2(msg[0])+'</h3><p style="margin:0;color:var(--muted)">'+esc2(msg[1])+'</p><div class="btns"><button type="button" class="btn primary" data-a="reload">আবার দেখুন</button><button type="button" class="btn" data-a="out">লগ আউট</button></div></section>';
}
async function start(){
  if(booted||starting)return;starting=true;
  try{
    var s=await sb.auth.getSession();
    if(!s.data||!s.data.session){paintAuth();return}
    uid=s.data.session.user.id;
    var prof=null;
    for(var i=0;i<6&&!prof;i++){var r=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();prof=r.data;if(!prof)await new Promise(function(ok){setTimeout(ok,500)})}
    if(!prof){paintWait(['অ্যাকাউন্ট তৈরি হয়নি','একটু পরে আবার চেষ্টা করুন।']);return}
    role=prof.role;isAdmin=role==='admin';
    if(role==='admin'||role==='member'){
      booted=true;hideAuth();
      var lo=document.getElementById('logout');if(lo){lo.hidden=false;lo.addEventListener('click',async function(){await sb.auth.signOut();location.reload()})}
      var sc=document.createElement('script');sc.textContent=document.getElementById('appjs').textContent;document.body.appendChild(sc);
      sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){var c=(p.new&&p.new.coll)||(p.old&&p.old.coll);if(c)reload(c)}).subscribe();
      if(isAdmin){loadAccts();setInterval(loadAccts,20000)}
    }else if(role==='blocked')paintWait(['অ্যাকাউন্ট বন্ধ আছে','এডমিনের সাথে যোগাযোগ করুন।']);
    else paintWait(['অনুমোদনের অপেক্ষায়','আপনার অ্যাকাউন্ট খোলা হয়েছে। এডমিন অনুমোদন দিলে ঢুকতে পারবেন।']);
  }finally{starting=false}
}
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')start();if(ev==='SIGNED_OUT'&&booted)location.reload()});
start();
})();
</script>
